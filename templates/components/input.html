{% if label %}
<label for="{{ id }}" class="block text-sm font-medium mb-1.5">{{ label }}</label>
{% endif %}
<input
  type="{{ type|default:'text' }}"
  id="{{ id }}"
  name="{{ name }}"
  value="{{ value|default:'' }}"
  placeholder="{{ placeholder|default:'' }}"
  {% if required %}required{% endif %}
  {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
  class="w-full h-11 rounded-lg bg-background border px-3 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-ring disabled:opacity-50 {% if error %}border-danger{% else %}border-input{% endif %}"
  {{ attributes }}
/>
{% if error %}
<p class="mt-1.5 text-sm text-danger flex items-center gap-1"><i data-lucide="alert-circle"></i> {{ error }}</p>
{% endif %}
