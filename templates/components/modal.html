<div
  x-data="{ open: false }"
  x-show="open"
  x-cloak
  @open-{{ id }}.window="open = true"
  @keydown.escape.window="open = false"
  class="relative z-50"
>
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="open = false"
    class="fixed inset-0 bg-background/70 backdrop-blur-sm"
  ></div>
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div
      x-show="open"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95"
      x-transition:enter-end="opacity-100 scale-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 scale-100"
      x-transition:leave-end="opacity-0 scale-95"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title-{{ id }}"
      @click.stop
      class="bg-card border border-border rounded-xl max-w-md w-full mx-auto shadow-lg"
    >
      <div class="flex items-center justify-between p-6 pb-0">
        <h2 id="modal-title-{{ id }}" class="text-base font-semibold">{{ title }}</h2>
        <button
          type="button"
          @click="open = false"
          aria-label="Close"
          class="inline-flex items-center justify-center w-8 h-8 rounded-lg hover:bg-muted transition-colors"
        ><i data-lucide="x"></i></button>
      </div>
      <div class="p-6">
        {% block inner %}{% endblock %}
      </div>
    </div>
  </div>
</div>
