<div role="alert" class="rounded-lg p-4 flex gap-3 {% if variant == 'success' %}bg-success/10{% elif variant == 'warning' %}bg-warning/10{% elif variant == 'danger' %}bg-danger/10{% else %}bg-muted{% endif %}">
  <div class="flex-shrink-0 mt-0.5">
    {% if variant == 'success' %}
    <i data-lucide="check-circle" class="w-5 h-5 text-success"></i>
    {% elif variant == 'warning' %}
    <i data-lucide="alert-triangle" class="w-5 h-5 text-warning"></i>
    {% elif variant == 'danger' %}
    <i data-lucide="alert-circle" class="w-5 h-5 text-danger"></i>
    {% else %}
    <i data-lucide="info" class="w-5 h-5 text-primary"></i>
    {% endif %}
  </div>
  <div class="flex-1 min-w-0">
    {% if title %}
    <h4 class="text-sm font-semibold">{{ title }}</h4>
    {% endif %}
    {% if message %}
    <p class="text-sm mt-0.5">{{ message }}</p>
    {% endif %}
  </div>
</div>
