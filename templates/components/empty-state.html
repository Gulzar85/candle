<div class="flex flex-col items-center justify-center py-16 px-6 text-center">
  <div class="flex items-center justify-center w-12 h-12 rounded-full bg-muted">
    <i data-lucide="{{ icon }}" class="w-6 h-6 text-muted-foreground"></i>
  </div>
  <h3 class="text-base font-semibold mt-4">{{ title }}</h3>
  <p class="text-sm text-muted-foreground mt-1 max-w-sm">{{ description }}</p>
  {% if action %}
  <div class="mt-4">{{ action }}</div>
  {% endif %}
</div>
