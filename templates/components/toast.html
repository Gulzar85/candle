<div
  role="status"
  aria-live="polite"
  class="fixed bottom-4 right-4 z-50 inline-flex items-center gap-2 rounded-xl bg-card border border-border px-4 py-3 shadow-lg max-w-sm"
>
  {% if variant == 'success' %}
  <i data-lucide="check-circle" class="w-4 h-4 text-success flex-shrink-0"></i>
  {% elif variant == 'danger' %}
  <i data-lucide="alert-circle" class="w-4 h-4 text-danger flex-shrink-0"></i>
  {% else %}
  <i data-lucide="info" class="w-4 h-4 text-primary flex-shrink-0"></i>
  {% endif %}
  <span class="text-sm">{{ message }}</span>
</div>
