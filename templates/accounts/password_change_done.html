{% extends "layouts/shell.html" %}

{% block content %}
<div class="px-4 lg:px-6 py-6 max-w-2xl">
  <div class="bg-card border border-border rounded-xl p-8 text-center">
    <div class="flex items-center justify-center w-12 h-12 rounded-full bg-success/10 mx-auto mb-4">
      <i data-lucide="check-circle" class="w-6 h-6 text-success" aria-hidden="true"></i>
    </div>
    <h1 class="text-xl font-semibold tracking-tight mb-2">Password changed</h1>
    <p class="text-sm text-muted-foreground mb-6">
      Your password has been updated. Other sessions have been signed out from this device.
    </p>
    <a href="{% url 'accounts:settings' %}"
       class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium min-h-[44px] transition-colors hover:bg-primary/90">
      Back to settings
    </a>
  </div>
</div>
{% endblock content %}
