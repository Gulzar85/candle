{% extends "layouts/auth.html" %}

{% block auth_content %}
<div class="text-center">
  <div class="flex items-center justify-center w-12 h-12 rounded-full bg-danger/10 mx-auto mb-4">
    <i data-lucide="shield-alert" class="w-6 h-6 text-danger" aria-hidden="true"></i>
  </div>
  <h1 class="text-xl font-semibold tracking-tight mb-2">This link is invalid</h1>
  <p class="text-sm text-muted-foreground mb-6">
    The verification link is missing, invalid, or has already been used.
  </p>
  <div class="space-y-2">
    <a href="{% url 'accounts:resend_verification' %}"
       class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium min-h-[44px] transition-colors hover:bg-primary/90">
      Send a new link
    </a>
    <a href="{% url 'accounts:login' %}"
       class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-input bg-background px-4 py-2.5 text-sm font-medium min-h-[44px] text-foreground transition-colors hover:bg-muted">
      Back to sign in
    </a>
  </div>
</div>
{% endblock %}
