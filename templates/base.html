{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Candle - A private, collaborative partner whiteboard.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"inlineStyleNonce": "{{ csp_nonce }}"}'>

  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">

  <link rel="stylesheet" href="{% static 'dist/assets/main.css' %}" {% csp_nonce_attr %}>

  <script nonce="{{ csp_nonce }}">
    // Single source of truth for the theme: applied inline (before any
    // stylesheet/script loads) to avoid a flash of the wrong theme, and
    // exposed on window.__theme so later UI (the shell's quick toggle, the
    // Settings > Appearance control) reads/writes state through the same
    // implementation instead of re-deriving it independently.
    //
    // Stored mode is one of 'system' | 'light' | 'dark'. 'system' keeps
    // following the OS preference live (via a matchMedia listener) until the
    // visitor explicitly picks light or dark.
    (function () {
      var root = document.documentElement;
      var media = window.matchMedia('(prefers-color-scheme: dark)');

      function resolvedDark(mode) {
        return mode === 'dark' || (mode === 'system' && media.matches);
      }

      function apply(mode) {
        var dark = resolvedDark(mode);
        root.classList.toggle('dark', dark);
        root.classList.toggle('light', !dark);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0a0a0a' : '#ffffff');
      }

      window.__theme = {
        getMode: function () { return localStorage.getItem('theme') || 'system'; },
        isDark: function () { return root.classList.contains('dark'); },
        setMode: function (mode) {
          if (mode === 'system') {
            localStorage.removeItem('theme');
          } else {
            localStorage.setItem('theme', mode);
          }
          apply(mode);
        },
        set: function (dark) {
          // Back-compat binary setter: an explicit light/dark choice.
          window.__theme.setMode(dark ? 'dark' : 'light');
        },
        toggle: function () { window.__theme.set(!window.__theme.isDark()); },
      };

      apply(window.__theme.getMode());
      media.addEventListener('change', function () {
        if (window.__theme.getMode() === 'system') apply('system');
      });
    })();
  </script>

  {% block extra_css %}{% endblock %}
</head>
<body class="bg-background text-foreground antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  {% block body %}{% endblock %}

  <script type="module" src="{% static 'dist/assets/main.js' %}" {% csp_nonce_attr %}></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
