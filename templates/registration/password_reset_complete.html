{% extends "layouts/auth.html" %}

{% block auth_content %}
<div class="text-center">
  <div class="flex items-center justify-center w-12 h-12 rounded-full bg-success/10 mx-auto mb-4">
    <i data-lucide="check-circle" class="w-6 h-6 text-success" aria-hidden="true"></i>
  </div>
  <h1 class="text-xl font-semibold tracking-tight mb-2">Password changed</h1>
  <p class="text-sm text-muted-foreground mb-6">
    Your password has been reset. You can now sign in with your new password.
  </p>
  <a href="{% url 'accounts:login' %}"
     class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium min-h-[44px] transition-colors hover:bg-primary/90">
    Sign in
  </a>
</div>
{% endblock %}
