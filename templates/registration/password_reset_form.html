{% extends "layouts/auth.html" %}

{% block auth_content %}
<h1 class="text-xl font-semibold tracking-tight mb-1">Forgot your password?</h1>
<p class="text-sm text-muted-foreground mb-6">
  Enter the email associated with your account and we'll send you a reset link.
</p>

<form method="post" action="{% url 'accounts:password_reset' %}" novalidate>
  {% csrf_token %}
  {% include "accounts/_field.html" with field=form.email %}

  <div class="mt-6">
    <button type="submit"
            class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium min-h-[44px] transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
      Send reset link
    </button>
  </div>
</form>

<p class="mt-6 text-center text-sm text-muted-foreground">
  <a href="{% url 'accounts:login' %}" class="font-medium text-primary hover:underline">Back to sign in</a>
</p>
{% endblock %}
