{% extends "emails/email_base.html" %}

{% block email_body %}
<p style="font-size:15px;line-height:1.6;margin:0 0 8px;">Hi,</p>
<p style="font-size:15px;line-height:1.6;margin:0 0 24px;">Your partnership on Candle has ended. All of your shared history and records are preserved.</p>
<p style="font-size:15px;line-height:1.6;margin:0 0 24px;">Whenever you're ready, you can start a new partnership from your space.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
  <tr>
    <td style="border-radius:8px;background-color:#2563eb;">
      <a href="{{ partnership_url }}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;">Go to your space</a>
    </td>
  </tr>
</table>
{% endblock %}
