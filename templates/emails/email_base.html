<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:24px 24px 8px;">
              <div style="width:40px;height:40px;border-radius:8px;background-color:#2563eb;display:inline-block;vertical-align:middle;"></div>
              <span style="font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:600;color:#0a0a0a;padding-left:10px;">Candle</span>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 24px;font-family:Helvetica,Arial,sans-serif;color:#0a0a0a;">
              {% block email_body %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#737373;padding:16px 0 0;margin:0;">
          &copy; Candle. You received this email because of activity on your account.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
