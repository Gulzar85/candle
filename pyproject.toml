[project]
name = "candle"
version = "0.1.0"
description = "Collaborative partner application with shared whiteboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Candle Team" }]

dependencies = [
    "Django>=6.1,<6.2",
    "channels>=4.3.2,<5",
    "daphne>=4.0.0,<5",
    "channels-redis>=4.3.0,<5",
    "djangorestframework>=3.18.0,<4",
    "psycopg[binary]>=3.3,<4",
    "redis>=8.1,<9",
    "whitenoise>=6.9,<7",
    "gunicorn>=23.0,<24",
    "Pillow>=11,<12",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "django-stubs>=5.2,<6",
    "pytest>=9,<10",
    "pytest-django>=4.11,<5",
    "pytest-asyncio>=1.0,<2",
    "pre-commit>=4.0,<5",
]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["apps", "config", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.ruff.lint.per-file-ignores]
# Django's standard split-settings pattern (`from .base import *`) is a
# wildcard import by design; F403/F405 would otherwise flag every setting
# each environment module inherits or overrides.
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# DRF and Channels/Daphne ship no type stubs / py.typed marker; treat them as
# untyped (Any) so the whiteboard API + realtime layer can import them without
# mypy errors.
[[tool.mypy.overrides]]
module = ["rest_framework", "rest_framework.*", "channels", "channels.*", "daphne", "daphne.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra -q --tb=short"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
